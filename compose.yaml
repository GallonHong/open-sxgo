services:
  mirror:
    profiles: [mirror]
    build:
      context: .
      dockerfile: infra/mirror/Dockerfile
    image: wfd-mirror:0.1.0
    ports: ['127.0.0.1:8080:8080']
    environment:
      MIRROR_SOURCE: ${MIRROR_SOURCE:-http://host.docker.internal:5173/public/}
      MIRROR_ROOT: /trust/root.json
    volumes:
      - mirror-data:/data
      - ./bootstrap/demo-root.json:/trust/root.json:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  intake:
    profiles: [intake]
    build:
      context: .
      dockerfile: infra/intake/Dockerfile
    image: wfd-intake:0.1.0
    ports: ['127.0.0.1:8787:8787']
    environment:
      WFD_BIND_HOST: 0.0.0.0
      WFD_ADMIN_ORIGIN: ${WFD_ADMIN_ORIGIN:-http://localhost:5175}
      WFD_INTAKE_ORIGIN: ${WFD_INTAKE_ORIGIN:-http://127.0.0.1:5174}
    volumes: ['private-data:/app/.runtime/private']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  mirror-data:
  private-data:
