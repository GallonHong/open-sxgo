services:
  mirror:
    profiles: [mirror]
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/mirror/Dockerfile
    image: ghcr.io/gallonhong/open-sxgo-mirror:latest
    ports: ['127.0.0.1:8080:8080']
    environment:
      MIRROR_SOURCE: ${MIRROR_SOURCE:-https://raw.githubusercontent.com/GallonHong/open-sxgo/main/public-data/public/}
      MIRROR_ROOT: /trust/root.json
    volumes:
      - mirror-data:/data
      - ./bootstrap/demo-root.json:/trust/root.json:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  intake:
    profiles: [intake]
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/intake/Dockerfile
    image: ghcr.io/gallonhong/open-sxgo-backend:latest
    ports: ['127.0.0.1:8787:8787']
    environment:
      WFD_BIND_HOST: 0.0.0.0
      WFD_MODE: ${WFD_MODE:-production}
      WFD_INTAKE_ENABLED: ${WFD_INTAKE_ENABLED:-true}
      WFD_ADMIN_ORIGIN: ${WFD_ADMIN_ORIGIN:-http://localhost:5175}
      WFD_INTAKE_ORIGIN: ${WFD_INTAKE_ORIGIN:-http://127.0.0.1:5174}
    volumes: ['private-data:/app/.runtime/private']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  ipfs:
    profiles: [ipfs]
    image: ipfs/kubo:v0.43.0@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2
    container_name: open-sxgo-ipfs
    restart: unless-stopped
    ports: ['127.0.0.1:8081:8080', '4001:4001', '4001:4001/udp']
    volumes: ['ipfs-data:/data/ipfs']
    environment:
      IPFS_PROFILE: server
    healthcheck:
      test: ['CMD', 'ipfs', 'id']
      interval: 15s
      timeout: 10s
      retries: 6
volumes:
  ipfs-data:
  mirror-data:
    name: ${MIRROR_VOLUME_NAME:-open-sxgo-mirror-data}
  private-data:
